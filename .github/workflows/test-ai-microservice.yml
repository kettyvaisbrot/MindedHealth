name: AI Microservice Tests

on:
  pull_request:
    paths:
      - "ai_microservice/**"
      - ".github/workflows/test-ai-microservice.yml"
  push:
    branches: [main]
    paths:
      - "ai_microservice/**"
      - ".github/workflows/test-ai-microservice.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r ai_microservice/requirements.txt
          pip install --no-cache-dir pytest httpx

      - name: Run tests
        run: pytest ai_microservice/tests/ --confcutdir=ai_microservice
