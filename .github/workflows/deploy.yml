name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Django image
        run: |
          TAG="${GITHUB_SHA::7}"
          docker build -t kettyvaisbrot/mindedhealth-django:$TAG .
          docker push kettyvaisbrot/mindedhealth-django:$TAG
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Assume AWS deploy role (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::339712948392:role/mindedhealth-github-actions-deploy
          aws-region: us-east-1

      - name: Deploy to the app server
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0ba0940a8a08113ca" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"set -e; sed -i 's|kettyvaisbrot/mindedhealth-django:.*|kettyvaisbrot/mindedhealth-django:${IMAGE_TAG}|g' /home/ec2-user/app/docker-compose.yml && cd /home/ec2-user/app && sudo docker-compose pull django celery-worker celery-beat && sudo docker-compose run --rm django python manage.py migrate --noinput && sudo docker-compose up -d\"]" \
            --query "Command.CommandId" --output text)

          for i in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-0ba0940a8a08113ca" --query "Status" --output text)
            if [ "$STATUS" != "InProgress" ] && [ "$STATUS" != "Pending" ]; then break; fi
            sleep 6
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-0ba0940a8a08113ca"
          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi
