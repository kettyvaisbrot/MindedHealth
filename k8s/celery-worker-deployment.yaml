apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  labels:
    app: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: kettyvaisbrot/mindedhealth-django:v5
          imagePullPolicy: Always
          command: ["celery", "-A", "MindedHealth", "worker", "--loglevel=info"]

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Same Django boot requirements as django-app, minus what this
          # process doesn't need: CHAT_MESSAGE_ENCRYPTION_KEY (end_chat_day
          # only deletes rows, never reads/decrypts content) and AI_SERVICE_URL.
          env:
            - name: DJANGO_ENV
              value: "production"

            - name: DJANGO_ALLOWED_HOSTS
              value: "a919efb57cd1347cb95609d34137c97f-1434627449.us-east-1.elb.amazonaws.com"

            - name: REDIS_HOST
              value: "redis"

            - name: DB_HOST
              value: "mindedhealth-postgres.c30a6w0247um.us-east-1.rds.amazonaws.com"
            - name: DB_NAME
              value: "mindedhealth"
            - name: DB_USER
              value: "mindedhealth_user"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: DB_PASSWORD
            - name: DB_PORT
              value: "5432"
