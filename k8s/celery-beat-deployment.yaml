apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  labels:
    app: celery-beat
spec:
  replicas: 1  # exactly one -- a second replica would fire every scheduled task twice
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: kettyvaisbrot/mindedhealth-django:v5
          imagePullPolicy: Always
          command: ["celery", "-A", "MindedHealth", "beat", "--loglevel=info"]

          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

          # Same reasoning as celery-worker-deployment.yaml: beat only needs
          # enough to boot Django and read CELERY_BEAT_SCHEDULE, it never
          # touches ChatMessage content or the database directly.
          env:
            - name: DJANGO_ENV
              value: "production"

            - name: DJANGO_ALLOWED_HOSTS
              value: "a919efb57cd1347cb95609d34137c97f-1434627449.us-east-1.elb.amazonaws.com"

            - name: REDIS_HOST
              value: "redis"

            - name: DB_HOST
              value: "mindedhealth-postgres.c30a6w0247um.us-east-1.rds.amazonaws.com"
            - name: DB_NAME
              value: "mindedhealth"
            - name: DB_USER
              value: "mindedhealth_user"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: DB_PASSWORD
            - name: DB_PORT
              value: "5432"
