{% extends 'base.html' %}

{% block title %}{{ patient.user.username }} - MindedHealth{% endblock %}

{% block content %}
<div class="container">
    <h2>{{ patient.user.username }}</h2>

    <div style="display: flex; flex-wrap: wrap; gap: 10px;">
        <a href="{% url 'my_statistics:statistics_view' %}?patient_id={{ patient.id }}" class="btn">View Statistics</a>
        <a href="{% url 'therapist_portal:patient_documentation' patient.id %}" class="btn">Documentation</a>
        <a href="{% url 'therapist_portal:patient_seizures' patient.id %}" class="btn">Seizure Days</a>
        <a href="{% url 'therapist_portal:patient_medications' patient.id %}" class="btn">Medications</a>
    </div>

    <p style="margin-top: 20px;"><a href="{% url 'therapist_dashboard' %}">← Back to Dashboard</a></p>
</div>
{% endblock %}
