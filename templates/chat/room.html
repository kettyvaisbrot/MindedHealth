<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
        }
        a {
            text-decoration: none;
        }
        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            margin: 10px 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        input[type="text"] {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
        }
        textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
        }
        .user-list {
            display: none;
            position: absolute;
            border: 1px solid #ccc;
            background-color: white;
            width: 150px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
        }
        .user-list div {
            padding: 8px;
            cursor: pointer;
        }
        .user-list div:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Chat Room</h2>
        <p><a href="{% url 'home' %}"><button>Back to Home</button></a></p>
        <p>You are chatting as: <strong id="my-pseudonym">connecting…</strong></p>

        <textarea id="chat-log" readonly style="height: 300px;"></textarea>
        <input type="text" id="chat-message-input" placeholder="Type a message...">

        <div id="user-list" class="user-list"></div>
    </div>

    <script>
        let userList = [];
        let oldestMessageId = null;
        let hasMoreHistory = false;
        let isLoadingHistory = false;

        function formatMessage(pseudonym, message, time) {
            return `[${time}] ${pseudonym}: ${message}\n`;
        }

        document.addEventListener('DOMContentLoaded', function () {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            const chatSocket = new WebSocket(wsProtocol + window.location.host + '/ws/chat/{{ room_name|escapejs }}/');
            const chatLog = document.querySelector('#chat-log');

            chatSocket.onmessage = function(e) {
                const data = JSON.parse(e.data);

                if (data.type === 'your_pseudonym') {
                    document.querySelector('#my-pseudonym').textContent = data.pseudonym;
                } else if (data.type === 'history') {
                    const text = data.messages.map(m => formatMessage(m.pseudonym, m.message, m.time)).join('');

                    if (oldestMessageId === null) {
                        // First page, on connect: fill the log and jump to the newest message.
                        chatLog.value = text;
                        chatLog.scrollTop = chatLog.scrollHeight;
                    } else {
                        // An older page, requested by scrolling up: prepend it while keeping
                        // the reader's current position, instead of yanking them to the top.
                        const previousHeight = chatLog.scrollHeight;
                        chatLog.value = text + chatLog.value;
                        chatLog.scrollTop = chatLog.scrollHeight - previousHeight;
                    }

                    if (data.messages.length > 0) {
                        oldestMessageId = data.messages[0].id;
                    }
                    hasMoreHistory = data.has_more;
                    isLoadingHistory = false;
                } else if (data.users) {
                    userList = data.users;
                    console.log('User list:', userList);
                } else {
                    chatLog.value += formatMessage(data.user, data.message, data.time);
                    chatLog.scrollTop = chatLog.scrollHeight;
                }
            };

            chatSocket.onclose = function(event) {
                if (event.code === 4000) {
                    // The chat day ended -- silently return home; re-entering the room
                    // gets a fresh pseudonym for the new day automatically.
                    window.location.href = '/';
                }
            };

            chatLog.addEventListener('scroll', function() {
                if (chatLog.scrollTop === 0 && hasMoreHistory && !isLoadingHistory) {
                    isLoadingHistory = true;
                    chatSocket.send(JSON.stringify({
                        action: 'load_history',
                        before_id: oldestMessageId,
                    }));
                }
            });

            document.querySelector('#chat-message-input').addEventListener('keyup', function(e) {
                const messageInput = e.target;
                const message = messageInput.value;

                if (e.key === '@') {
                    showUserList();
                }

                if (e.key === 'Enter' && message.trim()) {
                    chatSocket.send(JSON.stringify({
                        'message': message
                    }));

                    messageInput.value = '';
                }
            });

            function showUserList() {
                const userListDiv = document.querySelector('#user-list');
                userListDiv.innerHTML = '';
                userList.forEach(user => {
                    const div = document.createElement('div');
                    div.textContent = user;
                    div.onclick = function() {
                        const messageInput = document.querySelector('#chat-message-input');
                        messageInput.value += '@' + user + ' ';
                        userListDiv.style.display = 'none';
                    };
                    userListDiv.appendChild(div);
                });
                userListDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
